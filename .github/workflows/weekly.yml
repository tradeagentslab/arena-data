# Every Monday after the weekly board is final: copy it, the agent list and the week's
# ledgers into this repository, and post the top five to Discord (if a webhook is set).
name: weekly snapshot
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: weekly-snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.open.outputs.yes }}
    steps:
      - uses: actions/checkout@v5
      # Before the arena opens there is nothing to copy: stop here, quietly.
      - name: has the arena opened?
        id: open
        run: |
          opens=$(jq -r .opens config.json)
          if [ "$(date -u +%s)" -ge "$(date -u -d "$opens" +%s)" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "The arena opens $opens; skipping."; fi
      - uses: actions/setup-node@v5
        if: steps.open.outputs.yes == 'true'
        with:
          node-version: 24
      - name: tests first
        if: steps.open.outputs.yes == 'true'
        run: node --test test/*.test.mjs
      - name: copy last week's results
        if: steps.open.outputs.yes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/snapshot.mjs
      - name: commit if anything changed
        if: steps.open.outputs.yes == 'true'
        run: |
          git config user.name "TradeAgents Lab"
          git config user.email "hello@tradeagentslab.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Arena results up to $(date -u +%G-W%V)"
            git push
          fi

  # Then recompute the newest weekly board from what was just committed: every signature,
  # every chain link, every fill from Binance's public 1-minute candles. Fails on any
  # difference. Binance is asked only from here (GitHub's servers), at most 12 requests
  # a minute, and only for days not already in the cache.
  recompute:
    needs: snapshot
    if: needs.snapshot.outputs.open == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: the recompute tool (main repository)
        uses: actions/checkout@v5
        with:
          repository: tradeagentslab/tradeagentslab
          path: .tal
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: candles already downloaded
        uses: actions/cache@v4
        with:
          path: .candles
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: recompute the newest weekly board
        run: node .tal/guard/bin/tal.js arena recompute --data . --cache .candles
