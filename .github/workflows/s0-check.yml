# Check of a season that must not be published here (the S0 trial season,
# 2026-10-21 to 2026-10-27). Copies it from the live arena API into a temporary folder
# on the runner, then recomputes from the signed ledgers and Binance public candles:
#   - always: the running week's live board, up to its asOf (`--live`);
#   - once they exist: the newest closed weekly board and the season board.
# Fails on any difference. Nothing is committed, uploaded or posted; the folder goes
# away with the runner. Ignores the opening date in config.json.
#
# Runs every day at 02:00 UTC until 2026-10-28 (S0_LAST_RUN), and by hand.
# It stops quietly, without failing, when:
#   - arenaKey in config.json is still empty (the engine's public key, printed on its
#     first log line, goes there once the engine runs);
#   - the arena has no live board of this season (not started yet, or already reset);
#   - a scheduled run comes after S0_LAST_RUN.
# The run log is public (this repository is public); it shows the same numbers the
# arena's /api/ already serves.
name: S0 check
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season id (not published in this repository)
        required: false
        default: S0
        type: string
permissions:
  contents: read
concurrency: s0-check
env:
  SEASON: ${{ inputs.season || 'S0' }}
  S0_LAST_RUN: '2026-10-28'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: anything to check?
        id: gate
        run: |
          set -eu
          if ! printf '%s' "$SEASON" | grep -Eq '^S[0-9]{1,3}$'; then echo "::error::season must look like S0, got: $SEASON"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%F)" \> "$S0_LAST_RUN" ]; then
            echo "::notice::S0 is over (last scheduled run $S0_LAST_RUN); nothing to do."
            exit 0
          fi
          if [ -z "$(jq -r '.arenaKey // ""' config.json)" ]; then
            echo "::notice::arenaKey in config.json is still empty, so no signature can be checked yet. Put the arena engine's public key there (the engine prints it on its first log line)."
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: the recompute tool (main repository)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v5
        with:
          repository: tradeagentslab/tradeagentslab
          path: .tal
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 24
      - name: tests first
        if: steps.gate.outputs.go == 'true'
        run: node --test test/*.test.mjs
      - name: copy the season into a temporary folder (not into this repository)
        if: steps.gate.outputs.go == 'true'
        run: node scripts/snapshot.mjs --out "$RUNNER_TEMP/arena" --ignore-opens --live --season "$SEASON"
      - name: candles already downloaded
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: .candles
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      # Binance is asked only from here (GitHub's servers), at most 12 requests a minute,
      # and only for days not already in the cache (today's minutes are fetched each run).
      # Exit codes: 1 difference, 2 could not run, 3 Binance asked to stop. Any fails the job.
      - name: recompute (live board, then closed week and season)
        if: steps.gate.outputs.go == 'true'
        run: |
          set -u
          DIR="$RUNNER_TEMP/arena"
          KEY=$(jq -r .arenaKey config.json)
          if [ ! -f "$DIR/standings/latest.json" ]; then
            echo "::notice::The arena has no live board of season $SEASON (not started yet, or already reset); nothing to check."
            exit 0
          fi
          fail=0
          echo "== live board =="
          node .tal/guard/bin/tal.js arena recompute --data "$DIR" --live --arena-key "$KEY" --cache .candles || fail=1
          week=$(ls "$DIR/weekly" 2>/dev/null | grep -E '^[0-9]{4}-W[0-9]{2}\.json$' | sort | tail -n 1 | sed 's/\.json$//')
          if [ -n "$week" ]; then
            echo "== closed week $week =="
            node .tal/guard/bin/tal.js arena recompute --data "$DIR" --week "$week" --arena-key "$KEY" --cache .candles || fail=1
          fi
          if [ -f "$DIR/season/$SEASON.json" ]; then
            echo "== season $SEASON =="
            node .tal/guard/bin/tal.js arena recompute --data "$DIR" --season "$SEASON" --arena-key "$KEY" --cache .candles || fail=1
          fi
          exit "$fail"
